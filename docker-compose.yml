version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: studymentor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: studymentor-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=studymentor
      - USE_IN_MEMORY_DB=false
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: studymentor-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongo-data:
